<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Red Tech Soluciones</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* ========================= GENERAL ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#dfe3ea;
    color:white;
}

/* ========================= HEADER ========================= */

header{
    width:100%;
    background:linear-gradient(90deg,#0f172a,#1e293b);
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    top:0;
    z-index:1000;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:65px;
    height:65px;
    border-radius:50%;
    background:white;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* ========================= HERO ========================= */

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    background:linear-gradient(rgba(15,23,42,0.85),rgba(15,23,42,0.85)),
    url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1200');
    background-size:cover;
}

/* ========================= SECCIONES ========================= */

section{
    padding:90px 20px;
}

/* ========================= CARDS ========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    background:white;
    color:black;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
}

/* ========================= CONTACTO ========================= */

.contact{
    background:#1e293b;
}

.contact-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.contact-box{
    background:#0f172a;
    padding:20px;
    border-radius:15px;
    width:250px;
    text-align:center;
}

/* ========================= WHATSAPP ========================= */

.whatsapp-float{
    position:fixed;
    left:20px;
    bottom:20px;
    width:65px;
    height:65px;
    background:#25d366;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    color:white;
    z-index:9999;
}

/* ========================= CHATBOT PRO ========================= */

.chat-floating{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:9999;
}

.chat-bot{
    width:80px;
    cursor:pointer;
}

.chat-box{
    width:330px;
    background:white;
    border-radius:15px;
    display:none;
    margin-top:10px;
    overflow:hidden;
}

.chat-header{
    background:#2563eb;
    color:white;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.chat-header button{
    background:none;
    border:none;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.messages{
    height:260px;
    overflow-y:auto;
    padding:10px;
    color:black;
}

.message{
    margin:5px 0;
    padding:8px;
    border-radius:10px;
}

.user{
    background:#2563eb;
    color:white;
    text-align:right;
}

.bot{
    background:#dbeafe;
}

.chat-input{
    display:flex;
}

.chat-input input{
    flex:1;
    padding:10px;
    border:none;
    outline:none;
}

.chat-input button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px;
    cursor:pointer;
}

/* BOTONES CHAT */
.chat-box button{
    margin:5px 5px 0 0;
    padding:6px 10px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:12px;
}

</style>

</head>

<body>

<header>

<div class="logo-area">
    <img class="logo" src="red tech soluciones.png">
    <h1>RED TECH</h1>
</div>

<nav>
    <a href="#inicio">Inicio</a>
    <a href="#servicios">Servicios</a>
    <a href="#contacto">Contacto</a>
</nav>

</header>

<section class="hero" id="inicio">
<h2>RED TECH SOLUCIONES</h2>
</section>

<section id="servicios">

<h2>Servicios</h2>

<div class="cards">
<div class="card">Mantenimiento</div>
<div class="card">Software</div>
<div class="card">Repuestos</div>
</div>

</section>

<section class="contact" id="contacto">

<h2>Contacto</h2>

<div class="contact-container">

<div class="contact-box">WhatsApp</div>
<div class="contact-box">Correo</div>
<div class="contact-box">Instagram</div>

</div>

</section>

<!-- WHATSAPP -->
<a class="whatsapp-float" href="https://wa.me/573504555680">💬</a>

<!-- CHATBOT PRO -->
<div class="chat-floating">

<img id="chatIcon"
class="chat-bot"
src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">

<div class="chat-box" id="chatBox">

<div class="chat-header">
Red Tech Bot
<button id="toggleChat">×</button>
</div>

<div class="messages" id="messages">

<div class="message bot">
👋 Hola, soy el bot de Red Tech.<br><br>
🔧 Mantenimiento<br>
💻 Software<br>
🖥️ Repuestos<br>
📲 Escribe o usa los botones abajo
</div>

<div class="message bot">
<button onclick="quick('servicios')">Servicios</button>
<button onclick="quick('precios')">Precios</button>
<button onclick="quick('whatsapp')">WhatsApp</button>
</div>

</div>

<div class="chat-input">

<input id="userInput" placeholder="Escribe...">

<button id="sendBtn">Enviar</button>

</div>

</div>

</div>

<script>

/* CHATBOT PRO */

const chatIcon = document.getElementById("chatIcon");
const chatBox = document.getElementById("chatBox");
const toggleChat = document.getElementById("toggleChat");
const sendBtn = document.getElementById("sendBtn");
const userInput = document.getElementById("userInput");
const messages = document.getElementById("messages");

chatIcon.onclick = () => chatBox.style.display = "block";
toggleChat.onclick = () => chatBox.style.display = "none";

sendBtn.onclick = sendMessage;

userInput.addEventListener("keypress",(e)=>{
    if(e.key==="Enter") sendMessage();
});

function sendMessage(){

    const text = userInput.value.toLowerCase().trim();
    if(!text) return;

    add(text,"user");
    userInput.value="";

    setTimeout(()=>bot(text),500);
}

function add(text,type){

    const div = document.createElement("div");
    div.classList.add("message",type);
    div.innerHTML = text;

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function bot(text){

    let r="";

    if(text.includes("mantenimiento")||text.includes("pc")){
        r="🔧 Mantenimiento de computadores y laptops.";
    }
    else if(text.includes("software")){
        r="💻 Instalamos Windows y programas.";
    }
    else if(text.includes("repuesto")){
        r="🖥️ RAM, SSD y componentes.";
    }
    else{
        r=`📲 Escríbenos por WhatsApp:
        <a href="https://wa.me/573504555680" target="_blank">Abrir</a>`;
    }

    add(r,"bot");
}

function quick(option){

    if(option==="servicios"){
        add("🔧 Servicios: mantenimiento, software y repuestos","bot");
    }

    if(option==="precios"){
        add("💰 Escríbenos por WhatsApp para cotización","bot");
    }

    if(option==="whatsapp"){
        window.open("https://wa.me/573504555680","_blank");
    }
}

</script>

</body>
</html>
